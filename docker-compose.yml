services:
  workflow:
    build:
      context: .
      dockerfile: Dockerfile.all
    container_name: workflow
    ports:
      - "8081:8081"
      - "8001:8000"
      - "9001:9000"
    volumes:
      - ./configs:/data/conf
      # - ./mcp:/app/mcp
      - ./skills:/app/skills
      # 与 AGENT_SKILL_DIR 一致；部分模型会用「/agent/skills」臆测路径，额外挂载避免 node MODULE_NOT_FOUND
      - ./flowData/agent/skills:/agent/skills
      # 工作流规则链自动生成的技能目录
      - ./flowData/workflow/skills:/workflow/skills
      - ./flowData/agent_workspace:/app/agent_workspace
      - ./flowData/code_workspace:/app/code_workspace
      # 自动使用宿主机 SSH（免手动同步 overlay）；只读挂载更安全
      - ${HOME}/.ssh:/root/.ssh:ro
    environment:
      # HTTP / gRPC 监听地址（容器内需 0.0.0.0；宿主机映射见 ports）
      - SERVER_HTTP_ADDR=0.0.0.0:8000
      - SERVER_GRPC_ADDR=0.0.0.0:9000
      # Agent 读写文件、执行 shell 的工作区根路径（需与 volumes 挂载一致）
      - AGENT_WORKSPACE_ROOT=/app/agent_workspace
      # Postgres 连接（主机名用 compose 服务名 postgres-db）
      - DATA_POSTGRES_HOST=postgres-db
      - DATA_POSTGRES_PORT=5432
      - DATA_POSTGRES_USER=rulego
      - DATA_POSTGRES_PASSWORD=rulego
      - DATA_POSTGRES_DBNAME=rulego
      - DATA_POSTGRES_SSLMODE=disable
      - DATA_POSTGRES_TIMEZONE=Asia/Shanghai
      # Agent 技能文件：主目录（对应挂载 ./skills -> /app/skills）
      - AGENT_SKILL_DIR=/app/skills
      # 规则链创建的 SKILL 写入目录（与上面的 /workflow/skills 挂载保持一致）
      - RULE_CHAIN_SKILL_DIR=/workflow/skills
      # 管理后台「工作流技能」tab 读取目录
      - WORKFLOW_SKILL_DIR=/workflow/skills
      # 额外技能目录，逗号分隔多个路径；空则仅用主目录 + 内置兜底 + $HOME/.claude|cursor/skills（容器内需自行挂载）
      - AGENT_SKILL_DIRS=
      # 技能命名空间前缀：非空时扫描到的 skill id 会带上「namespace/」前缀，避免与其它来源同名冲突
      - AGENT_SKILL_NAMESPACE=
      # 技能白名单：逗号分隔的 skill id / 前缀*；空或 * 表示不限制；与 FileSkillExecutor 权限一致
      - AGENT_SKILL_ALLOWLIST=
      # 技能目录热更新轮询间隔（毫秒）
      - AGENT_SKILL_SCAN_INTERVAL_MS=1000
      # 供需要 Cursor Cloud / 相关集成的组件使用（无则留空）
      - CURSOR_API_KEY=
      # Tavily 搜索等工具用的 API Key（按需填写，勿提交敏感值到仓库）
      - TAVILY_API_KEY=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
    depends_on:
      postgres-db:
        condition: service_healthy
    restart: always
    networks:
      - rulego
  postgres-db:
    image: postgres:15
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: rulego
      POSTGRES_PASSWORD: rulego
      POSTGRES_DB: rulego
    volumes:
      - ./volumes/database_postgres-data:/var/lib/postgresql/data
      - ./sql/:/docker-entrypoint-initdb.d/
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U rulego -d rulego" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - rulego

networks:
  rulego:
    driver: bridge
