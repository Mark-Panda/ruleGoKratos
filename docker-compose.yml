services:
  workflow:
    build:
      context: .
      dockerfile: Dockerfile.all
    container_name: workflow
    ports:
      - "8081:8081"
      - "8001:8000"
      - "9001:9000"
    volumes:
      - ./configs:/data/conf
      - ./mcp:/app/mcp
      - ./skills:/app/skills
      # 与 AGENT_SKILL_DIR 一致；部分模型会用「/agent/skills」臆测路径，额外挂载避免 node MODULE_NOT_FOUND
      - ./skills:/agent/skills
      # 部分模型会写成 /agents/tavily-search/...（无 skills、且 agents 复数），与上条同源目录
      - ./skills:/agents
      - ./agent_workspace:/app/agent_workspace
    environment:
      - SERVER_HTTP_ADDR=0.0.0.0:8000
      - SERVER_GRPC_ADDR=0.0.0.0:9000
      - AGENT_WORKSPACE_ROOT=/app/agent_workspace
      - DATA_POSTGRES_HOST=postgres-db
      - DATA_POSTGRES_PORT=5432
      - DATA_POSTGRES_USER=rulego
      - DATA_POSTGRES_PASSWORD=rulego
      - DATA_POSTGRES_DBNAME=rulego
      - DATA_POSTGRES_SSLMODE=disable
      - DATA_POSTGRES_TIMEZONE=Asia/Shanghai
      - AGENT_SKILL_DIR=/app/skills
      - AGENT_SKILL_DIRS=
      - AGENT_SKILL_NAMESPACE=
      - AGENT_SKILL_ALLOWLIST=
      - AGENT_SKILL_SCAN_INTERVAL_MS=1000
      - CURSOR_API_KEY=
      - TAVILY_API_KEY=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
    depends_on:
      postgres-db:
        condition: service_healthy
    restart: always
    networks:
      - rulego
  postgres-db:
    image: postgres:15
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: rulego
      POSTGRES_PASSWORD: rulego
      POSTGRES_DB: rulego
    volumes:
      - ./volumes/database_postgres-data:/var/lib/postgresql/data
      - ./sql/:/docker-entrypoint-initdb.d/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rulego -d rulego"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - rulego

networks:
  rulego:
    driver: bridge
