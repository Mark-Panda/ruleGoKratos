syntax = "proto3";

package rulego.v1;

import "google/api/annotations.proto";
import "google/protobuf/struct.proto";

option go_package = "ruleGoKratos/api/rulego/v1;v1";

service Admin {
  rpc ListSkills (ListSkillsRequest) returns (ListSkillsReply) {
    option (google.api.http) = {
      get: "/api/v1/admin/skills"
    };
  }

  rpc UploadSkill (UploadSkillRequest) returns (UploadSkillReply) {
    option (google.api.http) = {
      post: "/api/v1/admin/skills/upload"
      body: "*"
    };
  }

  rpc ListMcpConfigs (ListMcpConfigsRequest) returns (ListMcpConfigsReply) {
    option (google.api.http) = {
      get: "/api/v1/admin/mcps"
    };
  }

  rpc CreateMcpConfig (CreateMcpConfigRequest) returns (McpConfigItem) {
    option (google.api.http) = {
      post: "/api/v1/admin/mcps"
      body: "*"
    };
  }

  rpc UpdateMcpConfig (UpdateMcpConfigRequest) returns (UpdateMcpConfigReply) {
    option (google.api.http) = {
      put: "/api/v1/admin/mcps/{id}"
      body: "*"
    };
  }

  rpc DeleteMcpConfig (DeleteMcpConfigRequest) returns (DeleteMcpConfigReply) {
    option (google.api.http) = {
      delete: "/api/v1/admin/mcps/{id}"
    };
  }

  // TestMcpConfig：http 模式用 SSE 连 endpoint；stdio 模式在本机拉起子进程。均执行 initialize 与 tools/list。
  rpc TestMcpConfig (TestMcpConfigRequest) returns (TestMcpConfigReply) {
    option (google.api.http) = {
      post: "/api/v1/admin/mcps/{id}/test"
      body: "*"
    };
  }

  rpc ListLlmConfigs (ListLlmConfigsRequest) returns (ListLlmConfigsReply) {
    option (google.api.http) = {
      get: "/api/v1/admin/llm-configs"
    };
  }

  rpc CreateLlmConfig (CreateLlmConfigRequest) returns (LlmConfigItem) {
    option (google.api.http) = {
      post: "/api/v1/admin/llm-configs"
      body: "*"
    };
  }

  rpc UpdateLlmConfig (UpdateLlmConfigRequest) returns (UpdateLlmConfigReply) {
    option (google.api.http) = {
      put: "/api/v1/admin/llm-configs/{id}"
      body: "*"
    };
  }

  rpc DeleteLlmConfig (DeleteLlmConfigRequest) returns (DeleteLlmConfigReply) {
    option (google.api.http) = {
      delete: "/api/v1/admin/llm-configs/{id}"
    };
  }

  rpc CreateLlmModelEntry (CreateLlmModelEntryRequest) returns (LlmModelEntryItem) {
    option (google.api.http) = {
      post: "/api/v1/admin/llm-configs/{config_id}/models"
      body: "*"
    };
  }

  rpc UpdateLlmModelEntry (UpdateLlmModelEntryRequest) returns (UpdateLlmModelEntryReply) {
    option (google.api.http) = {
      put: "/api/v1/admin/llm-model-entries/{id}"
      body: "*"
    };
  }

  rpc DeleteLlmModelEntry (DeleteLlmModelEntryRequest) returns (DeleteLlmModelEntryReply) {
    option (google.api.http) = {
      delete: "/api/v1/admin/llm-model-entries/{id}"
    };
  }

  // RunTerminal 在服务端执行 shell 命令（仅管理端；cwd 须在白名单目录下）。
  rpc RunTerminal (RunTerminalRequest) returns (RunTerminalReply) {
    option (google.api.http) = {
      post: "/api/v1/admin/terminal/run"
      body: "*"
    };
  }

  // GetLarkCliConfig 读取 lark-cli 配置文件（默认 ~/.lark-cli/config.json）及终端超时配置。
  rpc GetLarkCliConfig (GetLarkCliConfigRequest) returns (GetLarkCliConfigReply) {
    option (google.api.http) = {
      get: "/api/v1/admin/lark-cli/config"
    };
  }

  // SaveLarkCliConfig 写入 lark-cli 配置文件（须为合法 JSON）。
  rpc SaveLarkCliConfig (SaveLarkCliConfigRequest) returns (SaveLarkCliConfigReply) {
    option (google.api.http) = {
      put: "/api/v1/admin/lark-cli/config"
      body: "*"
    };
  }

  // 工作区管理（统一走 proto/http 契约）
  rpc ListWorkspaces (ListWorkspacesRequest) returns (ListWorkspacesReply) {
    option (google.api.http) = {
      get: "/api/v1/admin/workspaces"
    };
  }

  rpc GetWorkspace (GetWorkspaceRequest) returns (GetWorkspaceReply) {
    option (google.api.http) = {
      get: "/api/v1/admin/workspaces/{id}"
    };
  }

  rpc CreateWorkspace (CreateWorkspaceRequest) returns (CreateWorkspaceReply) {
    option (google.api.http) = {
      post: "/api/v1/admin/workspaces"
      body: "*"
    };
  }

  rpc UpdateWorkspace (UpdateWorkspaceRequest) returns (UpdateWorkspaceReply) {
    option (google.api.http) = {
      put: "/api/v1/admin/workspaces/{id}"
      body: "*"
    };
  }

  rpc SyncWorkspace (SyncWorkspaceRequest) returns (SyncWorkspaceReply) {
    option (google.api.http) = {
      post: "/api/v1/admin/workspaces/{id}/sync"
    };
  }

  rpc DeleteWorkspace (DeleteWorkspaceRequest) returns (DeleteWorkspaceReply) {
    option (google.api.http) = {
      delete: "/api/v1/admin/workspaces/{id}"
    };
  }

  // 可编排 Agent 配置管理
  rpc ListManagedAgents (ListManagedAgentsRequest) returns (ListManagedAgentsReply) {
    option (google.api.http) = {
      get: "/api/v1/admin/managed-agents"
    };
  }

  rpc GetManagedAgent (GetManagedAgentRequest) returns (GetManagedAgentReply) {
    option (google.api.http) = {
      get: "/api/v1/admin/managed-agents/{id}"
    };
  }

  rpc CreateManagedAgent (CreateManagedAgentRequest) returns (CreateManagedAgentReply) {
    option (google.api.http) = {
      post: "/api/v1/admin/managed-agents"
      body: "*"
    };
  }

  rpc UpdateManagedAgent (UpdateManagedAgentRequest) returns (UpdateManagedAgentReply) {
    option (google.api.http) = {
      put: "/api/v1/admin/managed-agents/{id}"
      body: "*"
    };
  }

  rpc DeleteManagedAgent (DeleteManagedAgentRequest) returns (DeleteManagedAgentReply) {
    option (google.api.http) = {
      delete: "/api/v1/admin/managed-agents/{id}"
    };
  }

  rpc ListSkillPackages (ListSkillPackagesRequest) returns (ListSkillPackagesReply) {
    option (google.api.http) = {
      get: "/api/v1/admin/skill-packages"
    };
  }

  // LLM Token 使用统计
  rpc GetLlmTokenStats (GetLlmTokenStatsRequest) returns (GetLlmTokenStatsReply) {
    option (google.api.http) = {
      get: "/api/v1/admin/llm-token/stats"
    };
  }

  rpc ListLlmTokenUsage (ListLlmTokenUsageRequest) returns (ListLlmTokenUsageReply) {
    option (google.api.http) = {
      get: "/api/v1/admin/llm-token/usage"
    };
  }
}

message ListSkillsRequest {}

message SkillItem {
  string name = 1;
  string path = 2;
  int64 size = 3;
  string updated_at = 4 [json_name = "updatedAt"];
}

message ListSkillsReply {
  string root = 1;
  repeated SkillItem items = 2;
}

message UploadSkillRequest {
  string path = 1;
  string content_base64 = 2 [json_name = "contentBase64"];
}

message UploadSkillReply {
  string path = 1;
}

message ListMcpConfigsRequest {}

message McpConfigItem {
  int64 id = 1;
  string name = 2;
  string server = 3;
  string endpoint = 4;
  google.protobuf.Struct headers = 5;
  bool enabled = 6;
  string description = 7;
  string created_at = 8 [json_name = "createdAt"];
  string updated_at = 9 [json_name = "updatedAt"];
  // http | stdio；stdio 时使用 stdio_command / stdio_args_json / stdio_env_json，endpoint 可为空。
  string transport = 10;
  string stdio_command = 11 [json_name = "stdioCommand"];
  string stdio_args_json = 12 [json_name = "stdioArgsJson"];
  string stdio_env_json = 13 [json_name = "stdioEnvJson"];
}

message ListMcpConfigsReply {
  repeated McpConfigItem items = 1;
}

message CreateMcpConfigRequest {
  string name = 1;
  string server = 2;
  string endpoint = 3;
  google.protobuf.Struct headers = 4;
  bool enabled = 5;
  string description = 6;
  string transport = 7;
  string stdio_command = 8 [json_name = "stdioCommand"];
  string stdio_args_json = 9 [json_name = "stdioArgsJson"];
  string stdio_env_json = 10 [json_name = "stdioEnvJson"];
}

message UpdateMcpConfigRequest {
  int64 id = 1;
  string name = 2;
  string server = 3;
  string endpoint = 4;
  google.protobuf.Struct headers = 5;
  bool enabled = 6;
  string description = 7;
  string transport = 8;
  string stdio_command = 9 [json_name = "stdioCommand"];
  string stdio_args_json = 10 [json_name = "stdioArgsJson"];
  string stdio_env_json = 11 [json_name = "stdioEnvJson"];
}

message UpdateMcpConfigReply {}

message DeleteMcpConfigRequest {
  int64 id = 1;
}

message DeleteMcpConfigReply {}

message TestMcpConfigRequest {
  int64 id = 1;
}

message TestMcpConfigReply {
  bool ok = 1;
  string message = 2;
  repeated string tool_names = 3 [json_name = "toolNames"];
  string server_name = 4 [json_name = "serverName"];
  string protocol_version = 5 [json_name = "protocolVersion"];
}

message RunTerminalRequest {
  string command = 1;
  string cwd = 2;
}

message RunTerminalReply {
  int32 exit_code = 1 [json_name = "exitCode"];
  string stdout = 2;
  string stderr = 3;
  string diagnostic = 4;
}

message GetLarkCliConfigRequest {}

message GetLarkCliConfigReply {
  // 配置文件文本（不存在时为空）
  string content = 1;
  // 服务端解析后的绝对路径，便于对照 ~/.lark-cli/config.json
  string resolved_path = 2 [json_name = "resolvedPath"];
  bool exists = 3;
  // 当前生效的 RunTerminal 超时（秒），来自 configs agent.terminal_exec_timeout
  int32 terminal_exec_timeout_sec = 4 [json_name = "terminalExecTimeoutSec"];
}

message SaveLarkCliConfigRequest {
  string json_raw = 1 [json_name = "jsonRaw"];
}

message SaveLarkCliConfigReply {}

message ListWorkspacesRequest {}

message WorkspaceRepoItem {
  string url = 1;
  string dir = 2;
}

message WorkspaceItem {
  string id = 1;
  string name = 2;
  string description = 3;
  string root_dir = 4 [json_name = "rootDir"];
  string config_file = 5 [json_name = "configFile"];
  repeated string repository_urls = 6 [json_name = "repositoryUrls"];
  repeated WorkspaceRepoItem repositories = 7;
  string created_at = 8 [json_name = "createdAt"];
  string updated_at = 9 [json_name = "updatedAt"];
}

message ListWorkspacesReply {
  repeated WorkspaceItem items = 1;
}

message GetWorkspaceRequest {
  string id = 1;
}

message GetWorkspaceReply {
  WorkspaceItem item = 1;
}

message CreateWorkspaceRequest {
  string id = 1;
  string name = 2;
  string description = 3;
  repeated string repository_urls = 4 [json_name = "repositoryUrls"];
}

message CreateWorkspaceReply {
  WorkspaceItem item = 1;
}

message UpdateWorkspaceRequest {
  string id = 1;
  string name = 2;
  string description = 3;
  repeated string repository_urls = 4 [json_name = "repositoryUrls"];
}

message UpdateWorkspaceReply {
  WorkspaceItem item = 1;
}

message SyncWorkspaceRequest {
  string id = 1;
}

message SyncWorkspaceReply {
  WorkspaceItem item = 1;
  string message = 2;
}

message DeleteWorkspaceRequest {
  string id = 1;
}

message DeleteWorkspaceReply {
  bool ok = 1;
}

message ListManagedAgentsRequest {}

message ManagedAgentItem {
  int64 id = 1;
  string name = 2;
  string description = 3;
  string system_prompt = 4 [json_name = "systemPrompt"];
  repeated string skill_package_ids = 5 [json_name = "skillPackageIds"];
  repeated int64 mcp_ids = 6 [json_name = "mcpIds"];
  int64 llm_config_id = 7 [json_name = "llmConfigId"];
  string model_scope = 8 [json_name = "modelScope"];
  repeated int64 model_entry_ids = 9 [json_name = "modelEntryIds"];
  bool enabled = 10;
  string created_at = 11 [json_name = "createdAt"];
  string updated_at = 12 [json_name = "updatedAt"];
  string workspace_id = 13 [json_name = "workspaceId"];
}

message ListManagedAgentsReply {
  repeated ManagedAgentItem items = 1;
}

message GetManagedAgentRequest {
  int64 id = 1;
}

message GetManagedAgentReply {
  ManagedAgentItem item = 1;
}

message CreateManagedAgentRequest {
  string name = 1;
  string description = 2;
  string system_prompt = 3 [json_name = "systemPrompt"];
  repeated string skill_package_ids = 4 [json_name = "skillPackageIds"];
  repeated int64 mcp_ids = 5 [json_name = "mcpIds"];
  int64 llm_config_id = 6 [json_name = "llmConfigId"];
  string model_scope = 7 [json_name = "modelScope"];
  repeated int64 model_entry_ids = 8 [json_name = "modelEntryIds"];
  bool enabled = 9;
  string workspace_id = 10 [json_name = "workspaceId"];
}

message CreateManagedAgentReply {
  ManagedAgentItem item = 1;
}

message UpdateManagedAgentRequest {
  int64 id = 1;
  string name = 2;
  string description = 3;
  string system_prompt = 4 [json_name = "systemPrompt"];
  repeated string skill_package_ids = 5 [json_name = "skillPackageIds"];
  repeated int64 mcp_ids = 6 [json_name = "mcpIds"];
  int64 llm_config_id = 7 [json_name = "llmConfigId"];
  string model_scope = 8 [json_name = "modelScope"];
  repeated int64 model_entry_ids = 9 [json_name = "modelEntryIds"];
  bool enabled = 10;
  string workspace_id = 11 [json_name = "workspaceId"];
}

message UpdateManagedAgentReply {
  ManagedAgentItem item = 1;
}

message DeleteManagedAgentRequest {
  int64 id = 1;
}

message DeleteManagedAgentReply {
  bool ok = 1;
}

message ListSkillPackagesRequest {}

message SkillPackageItem {
  string id = 1;
  int64 skill_file_count = 2 [json_name = "skillFileCount"];
}

message ListSkillPackagesReply {
  string root = 1;
  repeated SkillPackageItem items = 2;
}

message ListLlmConfigsRequest {}

message LlmModelEntryItem {
  int64 id = 1;
  int64 config_id = 2 [json_name = "configId"];
  string model_name = 3 [json_name = "modelName"];
  string description = 4;
  bool enabled = 5;
  string created_at = 6 [json_name = "createdAt"];
  string updated_at = 7 [json_name = "updatedAt"];
}

message LlmConfigItem {
  int64 id = 1;
  string name = 2;
  string provider = 3;
  string base_url = 4 [json_name = "baseUrl"];
  bool enabled = 5;
  string api_key = 6 [json_name = "apiKey"];
  string description = 7;
  repeated LlmModelEntryItem models = 8;
  string created_at = 9 [json_name = "createdAt"];
  string updated_at = 10 [json_name = "updatedAt"];
}

message ListLlmConfigsReply {
  repeated LlmConfigItem items = 1;
}

message LlmModelEntryDraft {
  string model_name = 1 [json_name = "modelName"];
  string description = 2;
  bool enabled = 3;
}

message CreateLlmConfigRequest {
  string name = 1;
  string provider = 2;
  string base_url = 3 [json_name = "baseUrl"];
  string api_key = 4 [json_name = "apiKey"];
  bool enabled = 5;
  string description = 6;
  repeated LlmModelEntryDraft models = 7;
}

message UpdateLlmConfigRequest {
  int64 id = 1;
  string name = 2;
  string provider = 3;
  string base_url = 4 [json_name = "baseUrl"];
  string api_key = 5 [json_name = "apiKey"];
  bool enabled = 6;
  string description = 7;
}

message UpdateLlmConfigReply {}

message DeleteLlmConfigRequest {
  int64 id = 1;
}

message DeleteLlmConfigReply {}

message CreateLlmModelEntryRequest {
  int64 config_id = 1 [json_name = "configId"];
  string model_name = 2 [json_name = "modelName"];
  string description = 3;
  bool enabled = 4;
}

message UpdateLlmModelEntryRequest {
  int64 id = 1;
  string model_name = 2 [json_name = "modelName"];
  string description = 3;
  bool enabled = 4;
}

message UpdateLlmModelEntryReply {}

message DeleteLlmModelEntryRequest {
  int64 id = 1;
}

message DeleteLlmModelEntryReply {}

// LLM Token 统计
message GetLlmTokenStatsRequest {
  int64 config_id = 1 [json_name = "configId"];
  int64 model_entry_id = 2 [json_name = "modelEntryId"];
  string start_date = 3 [json_name = "startDate"];
  string end_date = 4 [json_name = "endDate"];
  string group_by = 5 [json_name = "groupBy"]; // day | model
}

message TokenStatItem {
  string period = 1;
  int64 prompt_tokens = 2 [json_name = "promptTokens"];
  int64 completion_tokens = 3 [json_name = "completionTokens"];
  int64 total_tokens = 4 [json_name = "totalTokens"];
  int64 request_count = 5 [json_name = "requestCount"];
}

message GetLlmTokenStatsReply {
  repeated TokenStatItem items = 1;
  int64 total_prompt_tokens = 2 [json_name = "totalPromptTokens"];
  int64 total_completion_tokens = 3 [json_name = "totalCompletionTokens"];
  int64 total_tokens = 4 [json_name = "totalTokens"];
  int64 total_requests = 5 [json_name = "totalRequests"];
}

message ListLlmTokenUsageRequest {
  int64 config_id = 1 [json_name = "configId"];
  int64 model_entry_id = 2 [json_name = "modelEntryId"];
  string start_date = 3 [json_name = "startDate"];
  string end_date = 4 [json_name = "endDate"];
  int32 page = 5;
  int32 page_size = 6 [json_name = "pageSize"];
}

message LlmTokenUsageItem {
  int64 id = 1;
  int64 config_id = 2 [json_name = "configId"];
  int64 model_entry_id = 3 [json_name = "modelEntryId"];
  string session_id = 4 [json_name = "sessionId"];
  string request_id = 5 [json_name = "requestId"];
  int64 prompt_tokens = 6 [json_name = "promptTokens"];
  int64 completion_tokens = 7 [json_name = "completionTokens"];
  int64 total_tokens = 8 [json_name = "totalTokens"];
  string model_name = 9 [json_name = "modelName"];
  string action_type = 10 [json_name = "actionType"];
  string user_id = 11 [json_name = "userId"];
  string project_path = 12 [json_name = "projectPath"];
  string created_at = 13 [json_name = "createdAt"];
}

message ListLlmTokenUsageReply {
  repeated LlmTokenUsageItem items = 1;
  int64 total = 2;
}

// 远程技能库 (clawhubcn.com)
