syntax = "proto3";

package rulego.v1;

import "google/api/annotations.proto";
import "openapi/v3/annotations.proto";

option go_package = "ruleGoKratos/api/rulego/v1;v1";

// Chat服务定义
service Chat {
    // 与大模型流式对话
    rpc ChatStream(ChatStreamReq) returns (stream ChatStreamReply) {
        option (google.api.http) = {
            post: "/api/v1/chat/stream"
            body: "*"
        };
        option (openapi.v3.operation) = {
            operation_id: "ChatStream"
            tags: "Chat"
            summary: "与大模型流式对话"
            description: "使用Server-Sent Events (SSE)实现与大模型的流式对话"
        };
    }
}

message ChatStreamReq {
    string message = 1;           // 用户消息
    string model = 2;             // 模型名称（托管模式下可留空，由模型条目解析）
    repeated ChatMessage history = 3; // 对话历史
    int64 llm_config_id = 4;      // 模型管理：LLM 配置 ID（与 llm_model_entry_id 成对）
    int64 llm_model_entry_id = 5; // 模型管理：模型条目 ID
    repeated ChatAttachment attachments = 6; // 上传文件（文本内联或 base64）
}

// 对话附件：优先使用 text（UTF-8）；二进制可用 content_base64 + mime_type。
message ChatAttachment {
    string filename = 1;
    string mime_type = 2;
    string text = 3;             // 可直接嵌入提示词的文本内容
    string content_base64 = 4;   // 可选，原始字节 base64（图片/压缩包等）
}

message ChatMessage {
    string role = 1;    // "user" 或 "assistant"
    string content = 2; // 消息内容
}

message ChatStreamReply {
    string content = 1;      // 流式返回的内容片段
    bool done = 2;           // 是否完成
    string error = 3;        // 错误信息（如果有）
}

