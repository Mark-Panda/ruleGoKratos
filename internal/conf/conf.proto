syntax = "proto3";
package kratos.api;

option go_package = "ruleGoKratos/internal/conf;conf";

import "google/protobuf/duration.proto";

message Bootstrap {
  Server server = 1;
  Data data     = 2;
  AI ai         = 3;
  Agent agent   = 4;
}

message Server {
  message HTTP {
    string network                   = 1;
    string addr                      = 2;
    google.protobuf.Duration timeout = 3;
  }
  message GRPC {
    string network                   = 1;
    string addr                      = 2;
    google.protobuf.Duration timeout = 3;
  }
  HTTP http = 1;
  GRPC grpc = 2;
}

message Data {
  message Redis {
    string network                         = 1;
    string addr                            = 2;
    google.protobuf.Duration read_timeout  = 3;
    google.protobuf.Duration write_timeout = 4;
  }
  message Postgres {
    string host     = 1;
    int32 port      = 2;
    string user     = 3;
    string password = 4;
    string dbname   = 5;
    string sslmode  = 6;
    string timezone = 7;
  }
  Redis redis       = 1;
  Postgres postgres = 2;
}

message AI {
  message DouBao {
    string model        = 1;
    string api_key      = 2;
    string api_base_url = 3;
  }
  message OpenAI {
    string model        = 1;
    string api_key      = 2;
    string api_base_url = 3;
  }
  DouBao doubao = 1;
  OpenAI openai = 2;
}

message Agent {
  string system_prompt = 1;
  // Agent 内置读/写文件与 shell 的根目录；空则回退为 skill.dir，再空则为进程工作目录
  string workspace_root = 3;
  // 管理端 RunTerminal 单条命令超时；未设置或 <=0 时默认 120s
  google.protobuf.Duration terminal_exec_timeout = 4;
  // 飞书 lark-cli 配置文件路径；空则使用 $HOME/.lark-cli/config.json（可用 ~ 前缀）
  string lark_cli_config_path = 5;
  message Memory {
    // 记忆文件存储目录；空则默认 ~/.claude/memory
    string dir = 11;
    // 记忆条目 TTL（天）；<=0 表示不启用 TTL 清理
    int32 entry_ttl_days = 12;
    int32 user_preferences_limit = 1;
    int32 user_feedback_limit = 2;
    int32 project_facts_limit = 3;
    int32 project_decisions_limit = 4;
    int32 project_summaries_limit = 5;
    int32 max_user_preferences_limit = 6;
    int32 max_user_feedback_limit = 7;
    int32 max_project_facts_limit = 8;
    int32 max_project_decisions_limit = 9;
    int32 max_project_summaries_limit = 10;
  }
  message Context {
    bool memory_enabled = 1;
    int32 summary_threshold = 2;
    int32 max_history_messages = 3;
  }
  message Skill {
    string dir              = 1;
    string dirs             = 2;
    string namespace        = 3;
    string allowlist        = 4;
    bool hot_reload         = 5;
    int32 scan_interval_ms  = 6;
  }
  Skill skill = 2;
  Memory memory = 6;
  Context context = 7;
}
