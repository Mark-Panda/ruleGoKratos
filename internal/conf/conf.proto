syntax = "proto3";
package kratos.api;

option go_package = "ruleGoKratos/internal/conf;conf";

import "google/protobuf/duration.proto";

message Bootstrap {
  Server server = 1;
  Data data     = 2;
  AI ai         = 3;
  Agent agent   = 4;
}

message Server {
  message HTTP {
    string network                   = 1;
    string addr                      = 2;
    google.protobuf.Duration timeout = 3;
  }
  message GRPC {
    string network                   = 1;
    string addr                      = 2;
    google.protobuf.Duration timeout = 3;
  }
  HTTP http = 1;
  GRPC grpc = 2;
}

message Data {
  message Redis {
    string network                         = 1;
    string addr                            = 2;
    google.protobuf.Duration read_timeout  = 3;
    google.protobuf.Duration write_timeout = 4;
  }
  message Postgres {
    string host     = 1;
    int32 port      = 2;
    string user     = 3;
    string password = 4;
    string dbname   = 5;
    string sslmode  = 6;
    string timezone = 7;
  }
  Redis redis       = 1;
  Postgres postgres = 2;
}

message AI {
  message DouBao {
    string model        = 1;
    string api_key      = 2;
    string api_base_url = 3;
  }
  message OpenAI {
    string model        = 1;
    string api_key      = 2;
    string api_base_url = 3;
  }
  DouBao doubao = 1;
  OpenAI openai = 2;
}

message Agent {
  string system_prompt = 1;
  // Agent 内置读/写文件与 shell 的根目录；空则回退为 skill.dir，再空则为进程工作目录
  string workspace_root = 3;
  message Skill {
    string dir              = 1;
    string dirs             = 2;
    string namespace        = 3;
    string allowlist        = 4;
    bool hot_reload         = 5;
    int32 scan_interval_ms  = 6;
  }
  Skill skill = 2;
}