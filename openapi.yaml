components:
    schemas:
        google.protobuf.ListValue:
            type: object
            properties:
                values:
                    type: array
                    items:
                        $ref: '#/components/schemas/google.protobuf.Value'
                    description: Repeated field of dynamically typed values.
            description: |-
                `ListValue` is a wrapper around a repeated field of values.

                 The JSON representation for `ListValue` is JSON array.
        google.protobuf.Value:
            description: Represents a dynamically typed value which can be either null, a number, a string, a boolean, a recursive struct value, or a list of values.
        playground.v1.AgentBinding:
            type: object
            properties:
                agentId:
                    type: string
                role:
                    type: string
                model:
                    type: string
                tools:
                    type: array
                    items:
                        type: string
        playground.v1.AgentDefinition:
            type: object
            properties:
                id:
                    type: string
                name:
                    type: string
                role:
                    type: string
                desc:
                    type: string
                model:
                    type: string
                tools:
                    type: array
                    items:
                        type: string
                enabled:
                    type: boolean
                priority:
                    type: integer
                    format: int32
                managedAgentId:
                    type: string
        playground.v1.AgentPool:
            type: object
            properties:
                id:
                    type: string
                name:
                    type: string
                description:
                    type: string
                agents:
                    type: array
                    items:
                        $ref: '#/components/schemas/playground.v1.AgentDefinition'
                createdAt:
                    type: string
                updatedAt:
                    type: string
        playground.v1.CollaborationMode:
            type: object
            properties:
                id:
                    type: string
                name:
                    type: string
                description:
                    type: string
        playground.v1.CollaborationScheme:
            type: object
            properties:
                id:
                    type: string
                name:
                    type: string
                description:
                    type: string
                mode:
                    type: string
                bindAgents:
                    type: array
                    items:
                        $ref: '#/components/schemas/playground.v1.AgentBinding'
                config:
                    $ref: '#/components/schemas/playground.v1.SchemeConfig'
                enabled:
                    type: boolean
                enableFinalizer:
                    type: boolean
                createdAt:
                    type: string
                updatedAt:
                    type: string
        playground.v1.CreateAgentPoolReply:
            type: object
            properties:
                pool:
                    $ref: '#/components/schemas/playground.v1.AgentPool'
        playground.v1.CreateAgentPoolReq:
            type: object
            properties:
                name:
