<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <!-- 渐变背景 -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    
    <!-- 流动线条渐变 -->
    <linearGradient id="flowGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="50%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#ff6b6b"/>
    </linearGradient>
    
    <!-- 光晕效果 -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- 阴影效果 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="5" stdDeviation="10" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- 背景圆 -->
  <circle cx="200" cy="200" r="180" fill="url(#bgGradient)" filter="url(#shadow)"/>
  
  <!-- 装饰性流动线条 -->
  <path d="M60 280 Q 120 240, 180 260 T 300 240 Q 340 230, 360 280" 
        stroke="rgba(255,255,255,0.15)" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M50 150 Q 100 180, 160 160 T 320 180 Q 360 190, 370 150" 
        stroke="rgba(255,255,255,0.1)" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <!-- 主要字母 B - 流动风格 -->
  <g filter="url(#glow)">
    <!-- B的上半部分 -->
    <path d="M120 120 
             L120 200 
             Q120 200, 140 200
             Q180 200, 200 220
             Q220 240, 200 260
             L200 260
             Q220 280, 180 280
             Q140 280, 120 260
             L120 280
             L120 280
             L120 120
             M160 140 L160 180
             Q180 180, 185 190
             Q190 200, 180 210
             Q170 220, 160 210
             L160 140Z" 
          fill="white"/>
  </g>
  
  <!-- 流动效果线条穿过 B -->
  <path d="M80 200 Q 140 180, 200 200 T 320 180" 
        stroke="url(#flowGradient)" stroke-width="4" fill="none" 
        stroke-linecap="round" filter="url(#glow)"/>
  
  <!-- 点缀的流动球 -->
  <circle cx="300" cy="190" r="8" fill="#00d4ff" filter="url(#glow)"/>
  <circle cx="320" cy="200" r="5" fill="#7c3aed" filter="url(#glow)"/>
  <circle cx="310" cy="215" r="6" fill="#ff6b6b" filter="url(#glow)"/>
  
  <!-- 品牌名称 -->
  <text x="200" y="330" 
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" 
        font-size="36" font-weight="bold" 
        fill="white" text-anchor="middle" letter-spacing="4">
    BaBo Flow
  </text>
  
  <!-- 装饰性小圆点 -->
  <circle cx="95" cy="330" r="3" fill="rgba(255,255,255,0.6)"/>
  <circle cx="305" cy="330" r="3" fill="rgba(255,255,255,0.6)"/>
</svg>
