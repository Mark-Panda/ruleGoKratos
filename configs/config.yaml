server:
  http:
    addr: ${SERVER_HTTP_ADDR}
    timeout: 10000s
  grpc:
    addr: ${SERVER_GRPC_ADDR}
    timeout: 1s
data:
  redis:
    addr: 127.0.0.1:6379
    read_timeout: 0.2s
    write_timeout: 0.2s
  postgres:
    host: ${DATA_POSTGRES_HOST}
    port: ${DATA_POSTGRES_PORT}
    user: ${DATA_POSTGRES_USER}
    password: ${DATA_POSTGRES_PASSWORD}
    dbname: ${DATA_POSTGRES_DBNAME}
    sslmode: ${DATA_POSTGRES_SSLMODE}
    timezone: ${DATA_POSTGRES_TIMEZONE}
ai:
  doubao:
    model: ${AI_DOUBAO_MODEL}
    api_key: ${AI_DOUBAO_API_KEY}
    api_base_url: ${AI_DOUBAO_BASE_URL}
  openai:
    model: ${AI_OPENAI_MODEL}
    api_key: ${AI_OPENAI_API_KEY}
    api_base_url: ${AI_OPENAI_BASE_URL}
agent:
  system_prompt: ${AGENT_SYSTEM_PROMPT:You are an AI agent harness. Use tools when needed and answer clearly.}
  skill:
    dir: ${AGENT_SKILL_DIR:skills}
    dirs: ${AGENT_SKILL_DIRS:}
    namespace: ${AGENT_SKILL_NAMESPACE:}
    allowlist: ${AGENT_SKILL_ALLOWLIST:}
    hot_reload: ${AGENT_SKILL_HOT_RELOAD:true}
    scan_interval_ms: ${AGENT_SKILL_SCAN_INTERVAL_MS:1000}
